pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: '*.{ts,vue,js,mjs,cjs}'
      run: npx oxlint --fix {staged_files}
      stage_fixed: true

    - name: format
      glob: '*.{ts,vue,js,mjs,cjs,json,md,yml,yaml}'
      exclude:
        - package-lock.json
      run: npx oxfmt {staged_files}
      stage_fixed: true
