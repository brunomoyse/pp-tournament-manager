name: Build and Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rollback to (e.g. v1.0.0)'
        required: true
        type: string

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.actor }}/pp-tournament-manager

# ── Check (auto on every push) ───────────────────────────────────────────────

jobs:
  check:
    if: github.event_name == 'push'
    name: Lint + Format Check
    runs-on: ubuntu-latest
    # GraphQL codegen (run by `nuxt prepare` in postinstall) introspects the
    # backend, which is unavailable in CI. Disable it so install/prepare work
    # offline — same flag the Dockerfile uses.
    env:
      DISABLE_CODEGEN: 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Format check (oxfmt)
        run: npm run format:check

  # ── Unit tests (auto on every push) ──────────────────────────────────────────

  test:
    if: github.event_name == 'push'
    name: Unit Tests
    runs-on: ubuntu-latest
    # `nuxt prepare` (postinstall) generates the `.nuxt/tsconfig.*` files vitest
    # needs; DISABLE_CODEGEN lets it run without the backend.
    env:
      DISABLE_CODEGEN: 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- run

  # ── End-to-end tests (auto on every push) ────────────────────────────────────
  #
  # Runs the Playwright suite against a REAL backend + Postgres, exactly like the
  # local ./e2e-harness.sh. The backend lives in a separate repo
  # (brunomoyse/pocketpair) and publishes ghcr.io/brunomoyse/pp-service:latest,
  # so we PULL that image rather than build Rust here, and check out the
  # pocketpair repo only for its seed fixtures.
  #
  # Report-only for now: it is intentionally NOT in the build jobs' `needs:` so a
  # flaky e2e run can't block a deploy. Add it to build_amd64/build_arm64 `needs`
  # once the suite has proven stable to make it a hard gate.

  test_e2e:
    if: github.event_name == 'push'
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      DISABLE_CODEGEN: 'true' # live backend is up, but the suite doesn't need generated TS types
      API_BASE_URL: 'http://localhost:8080'
      NUXT_GRAPHQL_ENDPOINT: 'http://localhost:8080/graphql'
      NUXT_GRAPHQL_WS_ENDPOINT: 'ws://localhost:8080/graphql'
      NUXT_AUTH_BASE_URL: 'http://localhost:8080'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: pocketpair
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pocketpair"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout manager
        uses: actions/checkout@v5

      - name: Checkout backend repo (for seed fixtures)
        uses: actions/checkout@v5
        with:
          repository: brunomoyse/pocketpair
          token: ${{ secrets.PAT }}
          path: _backend

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Start backend (pulls published image, runs migrations on boot)
        run: |
          docker run -d --name pp-backend --network host \
            -e DATABASE_URL=postgres://postgres:admin@localhost:5432/pocketpair \
            -e JWT_SECRET=ci-e2e-throwaway-secret \
            -e GQL_INTROSPECTION=true \
            -e PORT=8080 \
            -e RUST_LOG=info \
            ${{ env.DOCKER_REGISTRY }}/brunomoyse/pp-service:latest

      - name: Wait for backend /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "backend healthy"; exit 0
            fi
            sleep 2
          done
          echo "backend failed to become healthy"; docker logs pp-backend || true; exit 1

      - name: Seed fixtures
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          for f in _backend/pp-service/fixtures/*.sql; do
            echo "seeding $(basename "$f")"
            PGPASSWORD=admin psql -h localhost -U postgres -d pocketpair -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start manager dev server
        run: |
          TMPDIR=/tmp npm run dev > /tmp/manager-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then
              echo "manager up"; exit 0
            fi
            sleep 2
          done
          echo "manager dev server failed to start"; cat /tmp/manager-dev.log; exit 1

      - name: Run Playwright suite
        run: TMPDIR=/tmp npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # ── Build & deploy (auto on push to main) ────────────────────────────────────

  build_amd64:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    name: Build AMD64 Image
    needs: [check, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and Push AMD64 Image
        run: |
          docker buildx build . \
            --platform linux/amd64 \
            --build-arg API_BASE_URL=${{ vars.API_BASE_URL }} \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest-amd64 \
            --push

  build_arm64:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    name: Build ARM64 Image
    needs: [check, test]
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and Push ARM64 Image
        run: |
          docker buildx build . \
            --platform linux/arm64 \
            --build-arg API_BASE_URL=${{ vars.API_BASE_URL }} \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest-arm64 \
            --push

  create_manifest:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    name: Create Multi-Architecture Manifest
    runs-on: ubuntu-latest
    needs: [build_amd64, build_arm64]

    steps:
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Create and Push Manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest-amd64 \
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest-arm64

  deploy_test:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    needs: create_manifest
    name: Deploy to Home Server
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deploy webhook
        run: |
          curl -X POST ${{ vars.DEPLOY_WEBHOOK_URL }} \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            --fail --max-time 300

  # ── Production release (tag push v*) ────────────────────────────────────────

  build_production:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Build Production Image
    needs: [check, test]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and Push Production Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg API_BASE_URL=${{ vars.API_BASE_URL }} \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:production \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            --push \
            .

  deploy_production:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build_production
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.OVH_HOST }}
          username: ${{ vars.OVH_USER }}
          key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/pocketpair
            docker compose pull pp-tournament-manager
            docker compose up -d pp-tournament-manager
            docker image prune -f

  # ── Rollback (manual trigger) ────────────────────────────────────────────────

  rollback:
    if: github.event_name == 'workflow_dispatch'
    name: Rollback Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Rollback via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.OVH_HOST }}
          username: ${{ vars.OVH_USER }}
          key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/pocketpair
            docker pull ghcr.io/brunomoyse/pp-tournament-manager:${{ inputs.version }}
            docker tag ghcr.io/brunomoyse/pp-tournament-manager:${{ inputs.version }} ghcr.io/brunomoyse/pp-tournament-manager:production
            docker compose up -d pp-tournament-manager
            docker image prune -f
