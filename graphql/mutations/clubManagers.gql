mutation InviteClubManager($input: InviteClubManagerInput!) {
  inviteClubManager(input: $input) {
    createdAccount
    emailSent
  }
}

mutation RevokeClubManager($id: ID!) {
  revokeClubManager(id: $id)
}

mutation SetClubManagerRole($id: ID!, $role: ClubRole!) {
  setClubManagerRole(id: $id, role: $role)
}
